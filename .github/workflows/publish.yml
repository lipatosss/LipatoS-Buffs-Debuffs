name: Publish LipatoS module

on:
  push:
    branches: [main]
    paths:
      - 'module.json'
      - 'scripts/**'
      - 'tests/**'
      - 'styles/**'
      - 'icons/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lipatos-buffs-debuffs-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current module
        uses: actions/checkout@v4
      - name: Validate manifest and sources
        id: module
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/hunger.mjs
          node --check scripts/heather-mead.mjs
          node --check scripts/main.mjs
          node --check scripts/food.mjs
          node --check scripts/food-use-tracker.mjs
          node --check scripts/meal-shared.mjs
          node --check scripts/potions.mjs
          node --check scripts/panel-position.mjs
          node --test tests/*.test.mjs
          node <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('module.json', 'utf8'));
          const version = manifest.version;
          // These icons must not be shipped. The GM assigns own artwork.
          for (const dir of ['icons/foods', 'icons/beers']) {
            if (fs.existsSync(dir)) throw new Error('Do not bundle meal artwork: ' + dir);
          }
          // Hunger status art is independent and must remain available.
          for (let level=0; level<=6; level++) {
            const path = 'icons/hunger-' + level + '.webp';
            if (!fs.existsSync(path)) throw new Error('Missing hunger icon: ' + path);
          }
          if (manifest.id !== 'lipatos-buffs-debuffs' || !/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Invalid manifest id/version');
          const expected = 'https://github.com/lipatosss/LipatoS-Buffs-Debuffs/releases/download/v' + version + '/lipatos-buffs-debuffs.zip';
          if (manifest.download !== expected) throw new Error('Manifest download URL is inconsistent with version');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + version + '\n');
          NODE
      - name: Package Foundry module
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/lipatos-buffs-debuffs
          cp module.json dist/lipatos-buffs-debuffs/
          cp -a scripts styles icons dist/lipatos-buffs-debuffs/
          if [ -f README-fix.txt ]; then cp README-fix.txt dist/lipatos-buffs-debuffs/; fi
          (cd dist && zip -qr lipatos-buffs-debuffs.zip lipatos-buffs-debuffs)
          unzip -t dist/lipatos-buffs-debuffs.zip
      - name: Publish installable GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${{ steps.module.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/lipatos-buffs-debuffs.zip --clobber
          else
            gh release create "$tag" dist/lipatos-buffs-debuffs.zip --target main --title "LipatoS Buffs Debuffs $tag" --generate-notes
          fi
