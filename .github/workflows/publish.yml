name: Publish LipatoS module
on:
  push:
    branches: [main]
    paths:
      - 'lipatos-buffs-debuffs-v*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    # A deletion of obsolete ZIP files must not trigger another release.
    if: github.event_name == 'workflow_dispatch' || contains(toJSON(github.event.head_commit.added), 'lipatos-buffs-debuffs-v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract and validate module
        id: module
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find . -maxdepth 1 -name 'lipatos-buffs-debuffs-v*.zip' -type f -printf '%f\n' | sort -V | tail -n 1)"
          test -n "$archive"
          version="${archive#lipatos-buffs-debuffs-v}"
          version="${version%.zip}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p .module-upload
          unzip -q "$archive" -d .module-upload
          test -f .module-upload/lipatos-buffs-debuffs/module.json
          test -f .module-upload/lipatos-buffs-debuffs/scripts/main.mjs
          test -f .module-upload/lipatos-buffs-debuffs/scripts/hunger.mjs
          node -e "const m=require('./.module-upload/lipatos-buffs-debuffs/module.json'); const v=process.argv[1]; if(m.id!=='lipatos-buffs-debuffs'||m.version!==v||!m.manifest||!m.download) process.exit(1)" "$version"
          cp -a .module-upload/lipatos-buffs-debuffs/. .
          rm -rf .module-upload
          cp "$archive" lipatos-buffs-debuffs.zip
      - name: Commit sources and prune older ZIP archives
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for old_zip in lipatos-buffs-debuffs-v*.zip; do
            [ -e "$old_zip" ] || continue
            if [ "$old_zip" != "lipatos-buffs-debuffs-v${{ steps.module.outputs.version }}.zip" ]; then
              git rm -f -- "$old_zip"
            fi
          done
          git add module.json scripts/ styles/ icons/ README-fix.txt
          if ! git diff --cached --quiet; then
            git commit -m "Publish module source v${{ steps.module.outputs.version }}"
            git push origin HEAD:main
          fi
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.module.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" lipatos-buffs-debuffs.zip --clobber
          else
            gh release create "$tag" lipatos-buffs-debuffs.zip --target main --title "LipatoS Buffs Debuffs $tag" --generate-notes
          fi
